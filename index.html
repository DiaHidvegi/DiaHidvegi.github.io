<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dia Hidvégi</title>
  <meta name="description" content="Dia Hidvégi, AI research scientist and principal data scientist.">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23111'/></svg>">
</head>
<body>
  <header class="top">
    <a class="home" href="./" aria-current="page">Dia Hidvégi</a>
    <nav>
      <a href="projects.html">Projects</a>
      <a href="facts.html">Facts</a>
    </nav>
  </header>

  <main class="hero">
    <div class="card">
      <img src="assets/profile.jpg" alt="Dia Hidvégi">
      <h1>Dia Hidvégi</h1>
      <p>Principal Data Scientist at Intelmatix</p>
    </div>
  </main>

  <footer class="foot">
    <button class="copy" type="button" data-copy="dianahidvegi@gmail.com" aria-label="Copy email address">Email</button>
    <a href="https://github.com/DiaHidvegi" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.linkedin.com/in/dianahidvegi/" target="_blank" rel="noopener">LinkedIn</a>
  </footer>

  <script>
    // Copy the email address to the clipboard and show a short confirmation in place of the label.
    document.querySelectorAll('.copy').forEach(btn => {
      const label = btn.textContent;
      btn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = 'Copied'; }
        catch { btn.textContent = btn.dataset.copy; }
        btn.classList.add('done');
        clearTimeout(btn._t);
        btn._t = setTimeout(() => { btn.textContent = label; btn.classList.remove('done'); }, 1600);
      });
    });
  </script>
</body>
</html>
